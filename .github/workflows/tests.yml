name: Tests and Preflight

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-typecheck:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and type-checking dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" mypy
      - name: Run pytest suite
        shell: bash
        run: python -m pytest -v
      - name: Run mypy --strict
        shell: bash
        run: python -m mypy --strict src
      - name: Dogfood agent-preflight strictly on src/
        shell: bash
        run: python -m agent_preflight.cli src --fail-on warning --sarif-out dogfood.sarif

  action-smoke-test:
    name: Composite Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke-test composite action strictly on src/
        id: preflight
        uses: ./
        with:
          path: "src"
          format: "sarif"
          sarif-file: "action-smoke.sarif"
          fail-on: "warning"
      - name: Verify composite action outputs
        shell: bash
        env:
          FINDINGS_COUNT: ${{ steps.preflight.outputs.findings-count }}
          SARIF_FILE: ${{ steps.preflight.outputs.sarif-file }}
        run: |
          set -euo pipefail
          test "${FINDINGS_COUNT}" = "0"
          test -f "${SARIF_FILE}"
